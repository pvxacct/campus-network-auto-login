# 为 v* 标签创建 GitHub Release，只附上一个文件：单文件 exe（CampusNet.exe）。
# 源码在仓库 main 分支，使用说明见 docs/使用说明.md。
# 触发方式：
#   1) 推送 v* 标签（例如 git push origin v2.0.0-pre.1）时自动运行，发布该标签；
#   2) 在 Actions 页面点 “Run workflow” 手动运行（可指定标签、可勾选 Pre-release）。
# 说明：GITHUB_TOKEN 由 GitHub 自动提供，不需要配置任何密钥。
name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v2.0.0-pre.1；留空则使用最新的 v* 标签'
        required: false
        default: ''
      prerelease:
        description: '勾选则标记为 Pre-release（正式发布请不勾）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check executable
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="$(git describe --tags --abbrev=0)"; fi
          echo "tag=$tag" >> "$GITHUB_ENV"

          # 发布只提供单个 exe；源码在仓库 main 分支，使用说明在 docs/使用说明.md。
          if [ ! -f dist/CampusNet.exe ]; then
            echo "缺少 dist/CampusNet.exe —— 请先运行 build/Build-CampusNet.ps1 并提交产物。" >&2
            exit 1
          fi
          ls -l dist/CampusNet.exe
          sha256sum dist/CampusNet.exe

      # 发布前再卡一次源码指纹：防止「改了源码忘了重建」的产物被发出去。
      - name: Verify source fingerprint
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/CampusNet.exe.src.sha256')) {
            throw '缺少 dist/CampusNet.exe.src.sha256（源码指纹）——请运行 build/Build-CampusNet.ps1 并提交产物。'
          }
          $expected = ((Get-Content 'dist/CampusNet.exe.src.sha256' -Raw) -split '\s+')[0]
          $actual = (& build/Get-SourceFingerprint.ps1 | Out-String).Trim()
          Write-Host "提交的源码指纹：$expected"
          Write-Host "本次源码指纹：$actual"
          if ($expected -ne $actual) { throw '源码指纹不一致，拒绝发布：请先重新生成并提交 dist 产物。' }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then tag="$(git describe --tags --abbrev=0)"; fi
          ver="${tag#v}"
          exe="dist/CampusNet.exe"
          echo "tag=$tag"

          create_flags=(--latest)
          edit_flags=(--prerelease=false --latest)
          # 标签名里带 “-”（例如 v2.0.0-pre.1）自动按预发布处理；手动运行时的勾选框优先
          prerelease="${INPUT_PRERELEASE:-}"
          if [ -z "$prerelease" ] && [[ "$tag" == *-* ]]; then prerelease=true; fi
          if [ "$prerelease" = "true" ]; then
            create_flags=(--prerelease)
            edit_flags=(--prerelease)
          fi

          notes=(--generate-notes)
          if [ -f CHANGELOG.md ]; then
            awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {f=0} f {print}' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then notes=(--notes-file /tmp/notes.md); fi
          fi

          title="校园网自动登录 $tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release 已存在，更新标题、类型与说明。"
            gh release edit "$tag" --title "$title" "${edit_flags[@]}" "${notes[@]}"
          else
            gh release create "$tag" --title "$title" --verify-tag "${create_flags[@]}" "${notes[@]}"
          fi

          gh release upload "$tag" "$exe" --clobber

          # 只保留 CampusNet.exe：清掉这个 Release 里其它附件（例如历史版本留下的源码包 / 解压包）
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "删除多余附件：$name"
            gh release delete-asset "$tag" "$name" --yes
          done < <(gh release view "$tag" --json assets -q '.assets[].name | select(. != "CampusNet.exe")')

          echo "=== 最终附件列表 ==="
          gh release view "$tag" --json tagName,name,isPrerelease,url,assets
