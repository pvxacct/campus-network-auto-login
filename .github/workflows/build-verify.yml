# 校验仓库里提交的 dist\CampusNet.exe 与源码一致：在 Windows 上重新编译，
# 检查版本号、命令行自检，并和已提交的产物比对。
name: Build & Verify

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build from source
        shell: pwsh
        run: |
          dotnet build src\CampusNet\CampusNet.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw '编译失败' }

      - name: Smoke test built exe
        shell: pwsh
        run: |
          $exe = 'src\CampusNet\bin\Release\net48\CampusNet.exe'
          $version = (& $exe --version | Out-String).Trim()
          Write-Host "版本：$version"
          if ($version -ne '2.0.0') { throw "版本号不符合预期：$version" }
          & $exe --status

      - name: Verify committed exe
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\CampusNet.exe')) { throw '仓库缺少 dist\CampusNet.exe' }
          if (-not (Test-Path 'dist\CampusNet.exe.src.sha256')) {
            throw '仓库缺少 dist\CampusNet.exe.src.sha256（源码指纹）——请运行 build\Build-CampusNet.ps1 并提交 dist 下的产物。'
          }
          # 硬门禁：源码指纹不一致 = 改了源码没重新生成产物，直接失败。
          # 只比二进制会因为编译器版本差异误报（同样源码能差几十字节），所以二进制比对保持「警告」。
          $expected = ((Get-Content 'dist\CampusNet.exe.src.sha256' -Raw) -split '\s+')[0]
          $actual = (& build\Get-SourceFingerprint.ps1 | Out-String).Trim()
          Write-Host "提交的源码指纹：$expected"
          Write-Host "本次源码指纹：$actual"
          if ($expected -ne $actual) {
            throw 'dist\CampusNet.exe 与当前源码不一致（改了源码没重新生成产物）。请在本机运行 build\Build-CampusNet.ps1，并提交 dist 下的 exe 与两个校验文件。'
          }
          $built = (Get-FileHash 'src\CampusNet\bin\Release\net48\CampusNet.exe' -Algorithm SHA256).Hash
          $committed = (Get-FileHash 'dist\CampusNet.exe' -Algorithm SHA256).Hash
          Write-Host "构建产物：$built"
          Write-Host "仓库产物：$committed"
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' } else { '' }
          $exeVersion = (& 'dist\CampusNet.exe' --version | Out-String).Trim()
          Write-Host "exe 版本：$exeVersion"
          if ($tag -and -not $tag.StartsWith($exeVersion)) { throw "标签 $tag 与 exe 版本 $exeVersion 不一致" }
          if ($built -ne $committed) {
            Write-Warning '已提交的 dist\CampusNet.exe 与本次构建的字节不一致（编译器版本差异，源码指纹已通过，属正常情况）。'
          }

      - name: Run end-to-end tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'src\CampusNet\bin\Release\net48\CampusNet.exe').Path
          $log = Join-Path $env:RUNNER_TEMP 'e2e.log'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\Test-CampusNet.ps1 -Exe $exe 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 把失败断言变成 GitHub 注解：Actions 的原始日志只有仓库管理员能下载，
            # 注解却能用公开 API 读到，出问题时不必再靠猜。
            $fails = @(Select-String -Path $log -Pattern '^FAIL' | Select-Object -First 12)
            if ($fails.Count -eq 0) {
              Write-Host '::error title=端到端测试失败::没有 FAIL 行，可能中途异常退出，见日志尾部'
            }
            foreach ($f in $fails) { Write-Host ('::error title=端到端断言失败::{0}' -f $f.Line.Trim()) }
            $tail = ((Get-Content -LiteralPath $log -Tail 15) -join ' | ')
            Write-Host ('::error title=日志尾部::{0}' -f $tail)
            throw "端到端测试未通过（退出码 $code）"
          }
