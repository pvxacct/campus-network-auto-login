# 一次性维护任务：把 v2.0.0-pre.1 的发布附件精简到只剩 CampusNet.exe。
# 跑完即删（在后续提交里移除本文件），Actions 里只留只读的运行记录。
name: Trim v2.0.0-pre.1 assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Remove extra release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v2.0.0-pre.1
        run: |
          set -euo pipefail
          echo "=== 处理前的附件 ==="
          gh release view "$TAG" --json assets -q '.assets[].name'

          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ "$name" = "CampusNet.exe" ]; then continue; fi
            echo "删除附件：$name"
            gh release delete-asset "$TAG" "$name" --yes
          done < <(gh release view "$TAG" --json assets -q '.assets[].name')

          gh release view "$TAG" --json body -q .body > /tmp/body.md
          if ! grep -q '附件只提供' /tmp/body.md; then
            cp /tmp/body.md /tmp/body-new.md
            {
              echo ''
              echo '---'
              echo ''
              echo '> 说明：本预发布的附件只提供 `CampusNet.exe`（源码在仓库 `main` 分支，使用说明见 `docs/使用说明.md`）。'
            } >> /tmp/body-new.md
            gh release edit "$TAG" --notes-file /tmp/body-new.md
            echo "已补充附件说明。"
          else
            echo "说明已存在，跳过。"
          fi

          echo "=== 处理后的附件 ==="
          gh release view "$TAG" --json assets -q '.assets[].name'