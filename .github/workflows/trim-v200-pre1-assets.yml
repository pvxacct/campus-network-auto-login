# 一次性维护任务：把 v2.0.0-pre.1 的发布附件精简到只剩 CampusNet.exe。
# 跑完即删（在后续提交里移除本文件），Actions 里只留只读的运行记录。
name: Trim v2.0.0-pre.1 assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      # gh 需要 git 仓库上下文（或用 --repo 指定），这里两者都做，避免“not a git repository”。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove extra release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v2.0.0-pre.1
        run: |
          set -euxo pipefail
          REPO="$GITHUB_REPOSITORY"
          echo "仓库：$REPO"
          gh --version | head -n 1

          echo "=== 处理前的附件 ==="
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'

          # 用 API 拉取发布信息，再按附件 ID 逐个删除非 exe 的附件
          gh api "repos/$REPO/releases/tags/$TAG" > /tmp/release.json
          jq -r '.assets[] | select(.name != "CampusNet.exe") | "\(.id) \(.name)"' /tmp/release.json > /tmp/to-delete.txt
          if [ -s /tmp/to-delete.txt ]; then
            while read -r asset_id asset_name; do
              if [ -z "$asset_id" ]; then continue; fi
              echo "删除附件：$asset_name (id=$asset_id)"
              gh api -X DELETE "repos/$REPO/releases/assets/$asset_id"
            done < /tmp/to-delete.txt
          else
            echo "没有需要删除的附件。"
          fi

          # 说明里补一句：附件只有 exe
          jq -r '.body // ""' /tmp/release.json > /tmp/body.md
          if grep -q '附件只提供' /tmp/body.md; then
            echo "说明已存在，跳过。"
          else
            cp /tmp/body.md /tmp/body-new.md
            printf '\n---\n\n' >> /tmp/body-new.md
            printf '%s\n' '> 说明：本预发布的附件只提供 `CampusNet.exe`（源码在仓库 `main` 分支，使用说明见 `docs/使用说明.md`）。' >> /tmp/body-new.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body-new.md
            echo "已补充附件说明。"
          fi

          echo "=== 处理后的附件 ==="
          gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'