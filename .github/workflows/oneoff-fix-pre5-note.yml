# 一次性工作流：给 v2.0.0-pre.5 的 Release 加上「有严重问题」的醒目提示。
# 只改标题与说明文字，不新增 / 不替换 / 不删除任何附件（附件仍是那一个 CampusNet.exe）。
# 用完即删：跑完后下一次提交会把本文件删掉。
name: One-off fix pre.5 release note

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-pre5-note.yml'

permissions:
  contents: write

jobs:
  fix-note:
    runs-on: ubuntu-latest
    steps:
      - name: Update v2.0.0-pre.5 title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v2.0.0-pre.5
          repo="$GITHUB_REPOSITORY"
          title="校园网自动登录 v2.0.0-pre.5（有严重问题，请用 pre.6）"

          cat > /tmp/warn.md <<'EOF'
          > ## ⚠️ 这一版有严重问题，请勿使用，改用 [v2.0.0-pre.6](https://github.com/pvxacct/campus-network-auto-login/releases/tag/v2.0.0-pre.6)
          >
          > **现象**：账号被踢下线后**后台不会自动登录**，网络一直不恢复；有时托盘图标突然消失、
          > 日志从那一刻起不再更新（本机实测断档 3 小时以上），手动打开一次又能好一会儿。
          >
          > **原因**（翻本机事件日志与崩溃转储确认）：托盘提示文本被截断到 120 字，而 Windows 的上限是
          > **63 字**，`NotifyIcon.set_Text` 抛 `ArgumentOutOfRangeException` 直接把整个后台进程打崩；
          > 触发它的正是「账号已在别处在线（`userid error2`）」这类长文案。崩掉之后没有任何守护，
          > 于是没人再把程序拉起来。另外「账号已在别处在线 / 密码错误」当时还会被当成登录失败。
          >
          > **修复**（pre.6）：托盘提示统一压到 63 字以内并加兜底；新增守护进程（每 30 秒检查，
          > 崩溃/卡死自动拉起）；`userid error2` 与密码错误**完全忽略**（只记日志与计数，
          > 随后做几次轻量复检，通了就立刻算成功）；默认探测目标换成实测最稳的四条，
          > 疑似掉线时按 5 秒节奏复探。详见 [更新日志](https://github.com/pvxacct/campus-network-auto-login/blob/main/CHANGELOG.md)。

          ---
          EOF

          gh release view "$tag" --repo "$repo" --json body -q .body > /tmp/old.md || echo "" > /tmp/old.md
          cat /tmp/warn.md /tmp/old.md > /tmp/new.md
          gh release edit "$tag" --repo "$repo" --title "$title" --notes-file /tmp/new.md --prerelease

          echo "=== 更新后的 Release ==="
          gh release view "$tag" --repo "$repo" --json tagName,name,isPrerelease,assets
