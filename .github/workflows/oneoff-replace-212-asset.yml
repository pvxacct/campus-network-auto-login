# 一次性工作流：把 v2.1.2 Release 的附件换成重新构建的产物。
# 背景：旧产物里编译进了真实学号示例文案（已改为占位符 2xxxxxxxx）。
# 只覆盖同名附件，不动标签、不动说明、不动其它 Release。
# 用完即删：跑完后下一次提交会把本文件删掉。
name: One-off replace v2.1.2 asset

on:
  push:
    paths:
      - '.github/workflows/oneoff-replace-212-asset.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace v2.1.2 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          cp dist/CampusNet.exe CampusNet-v2.1.2.exe
          expected="$(cut -d' ' -f1 dist/CampusNet.exe.sha256)"
          actual="$(sha256sum CampusNet-v2.1.2.exe | cut -d' ' -f1)"
          echo "dist sha256 : $expected"
          echo "upload sha256: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error title=产物哈希不一致::dist 里的 sha256 与实际文件不符，拒绝上传"
            exit 1
          fi
          if grep -q '251731646' dist/CampusNet.exe; then
            echo "::error title=产物仍含真实学号::拒绝上传"
            exit 1
          fi
          gh release upload v2.1.2 CampusNet-v2.1.2.exe --repo "$repo" --clobber
          echo "=== v2.1.2 附件 ==="
          gh release view v2.1.2 --repo "$repo" --json tagName,prerelease,assets
