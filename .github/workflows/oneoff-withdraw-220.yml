# 一次性工作流：删除 v2.2.0-pre.1 的 GitHub Release（含标签），撤回这次预发布。
# 删完不影响其它 Release：v2.1.2 与仓库首页 Latest 保持原样。
# 用完即删：跑完后下一次提交会把本文件删掉。
name: One-off withdraw v2.2.0-pre.1

on:
  push:
    paths:
      - '.github/workflows/oneoff-withdraw-220.yml'

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v2.2.0-pre.1 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v2.2.0-pre.1
          repo="$GITHUB_REPOSITORY"

          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$repo" --yes --cleanup-tag
            echo "已删除 Release 与标签：$tag"
          else
            echo "Release 不存在，跳过：$tag"
          fi

          # 兜底：Release 已经不在、但标签还残留时，单独删掉标签
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$repo/git/refs/tags/$tag"
            echo "已删除残留标签：$tag"
          else
            echo "标签不存在：$tag"
          fi

          echo "=== 剩余 Release（前 6 个）==="
          gh release list --repo "$repo" --limit 6
          echo "=== 剩余标签（前 8 个）==="
          gh api "repos/$repo/tags" -q ".[].name" | head -8
