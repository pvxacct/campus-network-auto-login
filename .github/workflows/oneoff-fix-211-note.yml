# 一次性工作流：给 v2.1.1 的 Release 加上「有严重问题」的醒目提示，并把它转为 Pre-release。
# 只改标题 / 说明 / 类型，不新增 / 不替换 / 不删除任何附件（附件仍是那一个 CampusNet-v2.1.1.exe）。
# 用完即删：跑完后下一次提交会把本文件删掉。
name: One-off fix v2.1.1 release note

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-211-note.yml'

permissions:
  contents: write

jobs:
  fix-note:
    runs-on: ubuntu-latest
    steps:
      - name: Update v2.1.1 title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v2.1.1
          repo="$GITHUB_REPOSITORY"
          title="校园网自动登录 v2.1.1（有严重问题，请用 2.1.2）"

          cat > /tmp/warn.md <<'EOF'
          > ## ⚠️ 这一版有已知问题，请改用 [v2.1.2](https://github.com/pvxacct/campus-network-auto-login/releases/tag/v2.1.2)
          >
          > **现象**：账号被踢下线后可能长时间不恢复自动登录，需要手动点「立即重连」才生效。
          >
          > **原因**：2.1.0 / 2.1.1 把掉线发现与恢复确认的节奏改得更激进（在线探测 10 秒、异常探测 3 秒、
          > 会话核对 60 秒、疑似掉线连续 1 轮即核对、复检阶梯 1 秒一档并改成并行探测）。
          > 实测这套改动在本网络下反而更容易错过真正的恢复时机。
          >
          > **修复**：v2.1.2 已把核心逻辑整体回滚到 v2.0.0（探测 20 秒 / 异常 5 秒 / 会话核对 120 秒、
          > 疑似掉线连续 2 轮、复检阶梯 2/3/4/5/6/3 串行），界面保持 2.1.1。
          > 建议直接下载并使用 v2.1.2。

          ---
          EOF

          gh release view "$tag" --repo "$repo" --json body -q .body > /tmp/old.md || echo "" > /tmp/old.md
          cat /tmp/warn.md /tmp/old.md > /tmp/new.md
          gh release edit "$tag" --repo "$repo" --title "$title" --notes-file /tmp/new.md --prerelease

          echo "=== 更新后的 Release ==="
          gh release view "$tag" --repo "$repo" --json tagName,name,isPrerelease,assets
